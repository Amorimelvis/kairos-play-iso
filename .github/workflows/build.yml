---
name: Imagem Kairos Play OS
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.github/workflows/build-iso.yml']
  schedule:
    - cron: '20 9 * * *'   # todo dia: pega Bazzite + último kit Kairos Play
  workflow_dispatch:
    inputs:
      kit_tag:
        description: "Tag do kit (vazio = último release)"
        required: false
        default: ""

env:
  IMAGE_NAME: kairos-play-iso

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Construir e publicar a imagem
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Mais espaço em disco
        uses: ublue-os/remove-unwanted-software@v9

      - name: Versão do kit
        id: kit
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_TAG_IN: ${{ inputs.kit_tag }}
        run: |
          if [ -n "${KIT_TAG_IN}" ]; then tag="${KIT_TAG_IN}"; else
            tag="$(gh release view -R Amorimelvis/kairos-play-atualizacoes --json tagName -q .tagName)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Kit: ${tag}"

      - name: Construir
        run: |
          set -euxo pipefail
          REG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "REG=${REG}" >> "$GITHUB_ENV"
          sudo podman build --pull=newer \
            --build-arg KIT_TAG="${{ steps.kit.outputs.tag }}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="kit-${{ steps.kit.outputs.tag }}-$(date +%Y%m%d)" \
            -t "${REG}/${IMAGE_NAME}:latest" \
            -t "${REG}/${IMAGE_NAME}:$(date +%Y%m%d)" \
            -f Containerfile .
          sudo podman images

      - name: Publicar no GHCR
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "${REG}/${IMAGE_NAME}:latest"
          sudo podman push "${REG}/${IMAGE_NAME}:$(date +%Y%m%d)"
